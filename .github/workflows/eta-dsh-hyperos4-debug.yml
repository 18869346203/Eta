name: Eta DSH preview and HyperOS debug
on:
  push:
    branches: [eta-dsh-hyperos4-debug]
    paths: [.github/workflows/eta-dsh-hyperos4-debug.yml]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply reviewed Eta source changes
        shell: bash
        run: |
          sed -n '/^# ETA_PATCH_BEGIN$/,/^# ETA_PATCH_END$/{ /^# ETA_PATCH_BEGIN$/d; /^# ETA_PATCH_END$/d; s/^# //; p; }' .github/workflows/eta-dsh-hyperos4-debug.yml > "$RUNNER_TEMP/eta.patch"
          echo '4a786b8fd589ec44e1e0c662d097bca82eb7eee9ce3854f150d2c52e505dff55  '"$RUNNER_TEMP/eta.patch" | sha256sum -c -
          git apply --check --whitespace=error "$RUNNER_TEMP/eta.patch"
          git apply --whitespace=error "$RUNNER_TEMP/eta.patch"
      - uses: ./.github/actions/setup-build
      - name: Build Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Eta-DSH-Preview-HyperOS4-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Run unit tests
        run: ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest
